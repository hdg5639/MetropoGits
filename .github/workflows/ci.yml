name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned development dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check

      - name: Lint Python
        run: ruff check metropogits scripts tests

      - name: Compile Python
        run: python -m compileall -q metropogits scripts tests

      - name: Parse static viewer JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for script in metropogits/viewer_assets/*.js; do
            node --check "$script"
          done

      - name: Run contract and regression tests
        run: python -m unittest discover -s tests -v

  action-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build a fixture through the composite Action
        id: city
        uses: ./
        with:
          repository: tests/fixtures/repositories/spring-positive
          output: action-smoke-dist
          repo-id: fixture/hosted-action
          revision: hosted-runner

      - name: Verify the complete static artifact contract
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.city.outputs.artifact-path }}
          ACTION_STATUS: ${{ steps.city.outputs.status }}
        run: |
          set -euo pipefail
          test "$ACTION_STATUS" = "COMPLETE"
          for file in graph.ucg.json city.json preview.svg index.html manifest.json README_SNIPPET.md; do
            test -s "$ARTIFACT_PATH/$file"
          done

      - name: Smoke-test the genuine WebGL viewer
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.city.outputs.artifact-path }}
        run: |
          set -euo pipefail
          viewer_url="$(python -c 'import os, pathlib; print((pathlib.Path(os.environ["ARTIFACT_PATH"]) / "index.html").resolve().as_uri())')"
          dom_path="${RUNNER_TEMP}/metropogits-viewer-dom.html"
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=3000 --dump-dom "$viewer_url" > "$dom_path"
          grep -Fq '>WebGL 3D<' "$dom_path"
          grep -Fq 'aria-label="Interactive 3D repository city"' "$dom_path"
