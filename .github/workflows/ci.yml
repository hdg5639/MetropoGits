name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned development dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check

      - name: Lint Python
        run: ruff check metropogits scripts tests

      - name: Compile Python
        run: python -m compileall -q metropogits scripts tests

      - name: Parse static viewer JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for script in metropogits/viewer_assets/*.js; do
            node --check "$script"
          done

      - name: Run contract and regression tests
        run: python -m unittest discover -s tests -v
