[build-system]
requires = ["setuptools==65.5.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "metropogits"
version = "0.1.0"
description = "Turn source repositories into evidence-backed explorable cities"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.25.1",
]

[project.scripts]
metropogits = "metropogits.cli:main"

[tool.setuptools.packages.find]
include = ["metropogits*", "scripts*"]

[tool.setuptools.package-data]
metropogits = ["viewer_assets/*.css", "viewer_assets/*.html", "viewer_assets/*.js"]
